<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 800" width="1130" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;family=Merriweather:wght@700;900&amp;display=swap');
      .bg { fill: #ffffff; }
      .gold-accent { fill: #ca8a04; }
      .gold-border { fill: none; stroke: #ca8a04; stroke-width: 4; }
      .nasa-text { font-family: 'Roboto', sans-serif; font-size: 15px; font-weight: 500; fill: #1e293b; text-anchor: end; }
      .program-text { font-family: 'Roboto', sans-serif; font-size: 22px; font-style: italic; fill: #334155; text-anchor: middle; }
      .recipient-name { font-family: 'Roboto', sans-serif; font-weight: 900; font-size: 42px; fill: #0f172a; text-anchor: middle; }
      .course-title { font-family: 'Roboto', sans-serif; font-weight: 900; font-size: 38px; fill: #000000; text-anchor: middle; }
      .awarded-date { font-family: 'Roboto', sans-serif; font-weight: 700; font-size: 22px; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1130" height="800" class="bg" />

  <!-- Gold Frame Border -->
  <rect x="40" y="40" width="1050" height="720" class="gold-border" />

  <!-- Top-Left & Bottom-Right Gold Pixel Art Pixel Accents (from original NASA design) -->
  <!-- Top Left Pattern -->
  <g fill="#ca8a04" opacity="0.85">
    <rect x="0" y="0" width="20" height="20" />
    <rect x="20" y="0" width="20" height="20" />
    <rect x="40" y="0" width="20" height="20" />
    <rect x="0" y="20" width="20" height="20" />
    <rect x="20" y="20" width="20" height="20" />
    <rect x="0" y="40" width="20" height="20" />
    <rect x="60" y="0" width="15" height="15" />
    <rect x="0" y="60" width="15" height="15" />
  </g>

  <!-- Bottom Right Pattern -->
  <g fill="#ca8a04" opacity="0.85" transform="translate(1010, 680)">
    <rect x="60" y="60" width="20" height="20" />
    <rect x="40" y="60" width="20" height="20" />
    <rect x="20" y="60" width="20" height="20" />
    <rect x="60" y="40" width="20" height="20" />
    <rect x="40" y="40" width="20" height="20" />
    <rect x="60" y="20" width="20" height="20" />
    <rect x="80" y="0" width="15" height="15" />
    <rect x="0" y="80" width="15" height="15" />
  </g>

  <!-- NASA Header Top Right -->
  <g transform="translate(1000, 50)">
    <!-- NASA Text -->
    <text x="-15" y="25" class="nasa-text">National Aeronautics and</text>
    <text x="-15" y="45" class="nasa-text">Space Administration</text>

    <!-- NASA Meatball Logo Circle -->
    <circle cx="45" cy="35" r="32" fill="#0b3d91" />
    <!-- Red vector stroke -->
    <path d="M 20 50 Q 55 10 70 30" fill="none" stroke="#fc3d21" stroke-width="5" />
    <text x="45" y="43" font-family="'Roboto', sans-serif" font-weight="900" font-size="20px" fill="#ffffff" text-anchor="middle" letter-spacing="2px">NASA</text>
  </g>

  <!-- Watermark Circle in Center Background -->
  <g transform="translate(565, 380)" opacity="0.08">
    <circle cx="0" cy="0" r="220" fill="none" stroke="#000000" stroke-width="4" />
    <text x="0" y="-80" text-anchor="middle" font-family="'Roboto', sans-serif" font-weight="900" font-size="28px">REMOTE SENSING TRAINING PROGRAM</text>
    <text x="0" y="140" text-anchor="middle" font-family="'Roboto', sans-serif" font-weight="900" font-size="28px">TRAIN • EMPOWER • ADVANCE</text>
  </g>

  <!-- Body Content -->
  <g transform="translate(565, 210)">
    <text x="0" y="0" class="program-text">The NASA Applied Remote Sensing Training (ARSET) Program</text>
    <text x="0" y="40" class="program-text">presents this certificate of completion to</text>
  </g>

  <!-- Recipient Name -->
  <text x="565" y="340" class="recipient-name">Rushikesh Toge</text>

  <!-- Subtext -->
  <text x="565" y="415" font-family="'Roboto', sans-serif" font-size="22px" font-style="italic" fill="#334155" text-anchor="middle">For completing the training</text>

  <!-- Course Name -->
  <text x="565" y="495" class="course-title">Fundamentals of Remote Sensing</text>

  <!-- Bottom Gold Banner with Date -->
  <rect x="40" y="710" width="1050" height="50" class="gold-accent" />
  <text x="565" y="743" class="awarded-date">Awarded on May 20, 2026</text>

  <!-- Satellite Icon Bottom Left -->
  <g transform="translate(75, 735)">
    <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="#ffffff" stroke-width="3" />
    <!-- Satellite Icon -->
    <path d="M -15 -10 L 15 10 M -10 15 L 10 -15 M -5 -5 L 5 5" stroke="#38bdf8" stroke-width="3" />
  </g>
</svg>
