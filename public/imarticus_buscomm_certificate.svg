<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 800" width="1130" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;display=swap');
      .bg { fill: #ffffff; }
      .brand-teal { fill: #00685b; }
      .title-text { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 38px; fill: #00685b; letter-spacing: 2px; }
      .recipient-name { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 36px; fill: #1e293b; letter-spacing: 1px; }
      .course-name { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 30px; fill: #000000; }
      .grade-text { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 38px; fill: #00685b; }
      .label-text { font-family: 'Montserrat', sans-serif; font-size: 18px; fill: #475569; font-weight: 500; }
      .info-text { font-family: 'Montserrat', sans-serif; font-size: 14px; fill: #1e293b; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1130" height="800" class="bg" />

  <!-- Top Dark Teal Header Bar -->
  <rect x="0" y="0" width="1130" height="15" fill="#00685b" />

  <!-- Imarticus Logo Top Center -->
  <g transform="translate(420, 60)">
    <path d="M 0 0 L 15 25 L 30 0 L 22 0 L 15 12 L 8 0 Z" fill="#00685b" />
    <text x="40" y="20" font-family="'Montserrat', sans-serif" font-weight="900" font-size="28px" fill="#1e293b" letter-spacing="1px">IMARTICUS</text>
    <text x="41" y="38" font-family="'Montserrat', sans-serif" font-weight="600" font-size="12px" fill="#00685b" letter-spacing="8px">LEARNING</text>
  </g>

  <!-- Title -->
  <text x="565" y="180" text-anchor="middle" class="title-text">CERTIFICATE OF PROFICIENCY</text>
  <text x="565" y="230" text-anchor="middle" class="label-text">Proudly presented to</text>

  <!-- Recipient Name -->
  <text x="565" y="290" text-anchor="middle" class="recipient-name">TOGE RUSHIKESH</text>

  <text x="565" y="340" text-anchor="middle" class="label-text">For successfully completing the</text>

  <!-- Course Name -->
  <text x="565" y="390" text-anchor="middle" class="course-name">Business Communication</text>

  <text x="565" y="435" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="16px" fill="#475569" font-weight="500">
    For demonstrating consistent excellence and diligence throughout the program, he/she has earned a final
  </text>

  <!-- Grade A+ Box -->
  <text x="565" y="495" text-anchor="middle" class="grade-text">Grade : A+</text>

  <!-- Skill India & NSDC Logos Bottom Left -->
  <g transform="translate(50, 610)">
    <rect x="0" y="0" width="220" height="70" fill="none" />
    <text x="70" y="25" font-family="'Montserrat', sans-serif" font-weight="800" font-size="15px" fill="#1e3a8a">Skill India</text>
    <text x="70" y="45" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11px" fill="#00685b">NSDC National Skill Development</text>
    <text x="70" y="60" font-family="'Montserrat', sans-serif" font-weight="600" font-size="10px" fill="#f59e0b">Transforming the skill landscape</text>
  </g>

  <!-- Stamp & Verification Seal Center Bottom -->
  <g transform="translate(480, 610)">
    <circle cx="45" cy="35" r="30" fill="none" stroke="#00685b" stroke-width="3" stroke-dasharray="4,2" />
    <circle cx="45" cy="35" r="22" fill="#00685b" opacity="0.1" />
    <text x="45" y="39" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="800" font-size="10px" fill="#00685b">VERIFIED</text>
  </g>

  <!-- Signature Bottom Right -->
  <g transform="translate(850, 610)">
    <path d="M 10 30 C 30 10, 50 40, 80 15 S 130 35, 150 20" fill="none" stroke="#1e293b" stroke-width="2.5" />
    <text x="80" y="55" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="800" font-size="15px" fill="#1e293b">Nikhil Barshikhar</text>
    <text x="80" y="73" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="600" font-size="12px" fill="#64748b">Founder &amp; CEO</text>
  </g>

  <!-- Footer IDs & Date -->
  <text x="50" y="740" class="info-text">Certificate ID : 183FKM5X2SSDI</text>
  <text x="1080" y="740" text-anchor="end" class="info-text">Issued on : 21 January 2026</text>
</svg>
