<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 800" width="1130" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;family=Cinzel:wght@700&amp;display=swap');
      .bg { fill: #ffffff; }
      .red-banner { fill: #a81c1c; }
      .header-title { font-family: 'Roboto', sans-serif; font-weight: 900; font-size: 34px; fill: #a81c1c; letter-spacing: 1px; }
      .subhead { font-family: 'Roboto', sans-serif; font-size: 16px; fill: #333333; }
      .recipient { font-family: 'Roboto', sans-serif; font-weight: 900; font-size: 26px; fill: #111111; letter-spacing: 0.5px; }
      .course-title { font-family: 'Roboto', sans-serif; font-weight: 900; font-size: 30px; fill: #000000; }
      .score-text { font-family: 'Roboto', sans-serif; font-weight: 900; font-size: 32px; fill: #000000; }
      .score-box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .footer-bg { fill: #a81c1c; }
      .footer-text { font-family: 'Roboto', sans-serif; font-size: 14px; fill: #ffffff; font-weight: 500; }
      .elite-tag { font-family: 'Roboto', sans-serif; font-weight: 900; font-size: 22px; fill: #ffffff; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1130" height="800" class="bg" />
  <rect x="15" y="15" width="1100" height="770" fill="none" stroke="#222222" stroke-width="2" />

  <!-- Top Elite Ribbon Header -->
  <path d="M 465 0 L 665 0 L 645 50 L 485 50 Z" fill="#b91c1c" />
  <text x="565" y="34" text-anchor="middle" class="elite-tag">Elite</text>

  <!-- NPTEL Emblem / Logos Left & Right -->
  <!-- NPTEL Sun Circle Left -->
  <g transform="translate(60, 50)">
    <circle cx="50" cy="50" r="42" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="6,3" />
    <circle cx="50" cy="50" r="30" fill="#a81c1c" />
    <circle cx="50" cy="50" r="16" fill="#fbbf24" />
  </g>

  <!-- Skill India Logo Right -->
  <g transform="translate(950, 45)">
    <rect x="0" y="0" width="110" height="60" fill="none" />
    <text x="55" y="25" text-anchor="middle" font-family="'Roboto', sans-serif" font-weight="900" font-size="20px" fill="#1e3a8a">Skill India</text>
    <text x="55" y="45" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="12px" fill="#d97706">कौशल भारत - कुशल भारत</text>
  </g>

  <!-- Title Header -->
  <text x="565" y="115" text-anchor="middle" class="header-title">NPTEL ONLINE CERTIFICATION</text>
  <text x="565" y="145" text-anchor="middle" class="subhead">(Funded by the MoE, Govt. of India)</text>

  <text x="565" y="210" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="20px" fill="#222222">This certificate is awarded to</text>

  <!-- Recipient Name -->
  <text x="565" y="260" text-anchor="middle" class="recipient">TOGE RUSHIKESH NANASAHEB</text>
  <text x="565" y="300" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="20px" fill="#222222">for successfully completing the course</text>

  <!-- Course Name -->
  <text x="565" y="355" text-anchor="middle" class="course-name">Python for Data Science</text>

  <!-- Candidate Passport Photo Placeholder Right -->
  <g transform="translate(930, 190)">
    <rect x="0" y="0" width="120" height="150" fill="#e2e8f0" stroke="#000000" stroke-width="2" />
    <!-- Avatar head silhouette -->
    <circle cx="60" cy="55" r="28" fill="#475569" />
    <path d="M 20 135 C 20 95, 100 95, 100 135 Z" fill="#1e293b" />
    <!-- Tie / Collar -->
    <polygon points="60,95 52,115 60,135 68,115" fill="#3b82f6" />
  </g>

  <!-- Score Box -->
  <g transform="translate(250, 400)">
    <text x="140" y="32" text-anchor="end" font-family="'Roboto', sans-serif" font-size="20px" fill="#111111">with a consolidated score of</text>
    <rect x="160" y="0" width="100" height="48" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <text x="210" y="35" text-anchor="middle" class="score-text">62</text>
    <text x="280" y="32" font-family="'Roboto', sans-serif" font-size="24px" font-weight="700" fill="#111111">%</text>

    <!-- Table breakdown -->
    <rect x="0" y="65" width="600" height="42" class="score-box" />
    <line x1="220" y1="65" x2="220" y2="107" stroke="#000" stroke-width="2" />
    <line x1="300" y1="65" x2="300" y2="107" stroke="#000" stroke-width="2" />
    <line x1="510" y1="65" x2="510" y2="107" stroke="#000" stroke-width="2" />

    <text x="110" y="92" text-anchor="middle" font-family="'Roboto', sans-serif" font-weight="700" font-size="18px">Online Assignments</text>
    <text x="260" y="92" text-anchor="middle" font-family="'Roboto', sans-serif" font-weight="700" font-size="18px">19.17/25</text>
    <text x="405" y="92" text-anchor="middle" font-family="'Roboto', sans-serif" font-weight="700" font-size="18px">Proctored Exam</text>
    <text x="555" y="92" text-anchor="middle" font-family="'Roboto', sans-serif" font-weight="700" font-size="18px">42.75/75</text>
  </g>

  <!-- Total Candidates -->
  <text x="565" y="565" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="18px" font-weight="500" fill="#111111">
    Total number of candidates certified in this course: <tspan font-weight="700">16401</tspan>
  </text>

  <!-- Signatures / Dates / Institution -->
  <!-- Left Signature -->
  <g transform="translate(100, 610)">
    <path d="M 10 30 Q 30 5, 50 25 T 90 20 T 130 35" fill="none" stroke="#000" stroke-width="2.5" />
    <text x="0" y="55" font-family="'Roboto', sans-serif" font-weight="700" font-size="15px">Prof. Andrew Thangaraj</text>
    <text x="0" y="72" font-family="'Roboto', sans-serif" font-size="12px" fill="#555">Chair</text>
    <text x="0" y="87" font-family="'Roboto', sans-serif" font-size="12px" fill="#555">Centre for Outreach and Digital Education, IITM</text>
  </g>

  <!-- Center Date -->
  <g transform="translate(565, 630)">
    <text x="0" y="0" text-anchor="middle" font-family="'Roboto', sans-serif" font-weight="700" font-size="19px">Jan-Feb 2026</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15px" fill="#333">(4 week course)</text>
  </g>

  <!-- Right Signature -->
  <g transform="translate(850, 610)">
    <path d="M 10 35 Q 40 10, 70 30 T 120 15 T 150 25" fill="none" stroke="#000" stroke-width="2.5" />
    <text x="0" y="55" font-family="'Roboto', sans-serif" font-weight="700" font-size="15px">Prof. Vignesh Muthuvijayan</text>
    <text x="0" y="72" font-family="'Roboto', sans-serif" font-size="12px" fill="#555">NPTEL Coordinator</text>
    <text x="0" y="87" font-family="'Roboto', sans-serif" font-size="12px" fill="#555">IIT Madras</text>
  </g>

  <!-- IIT Madras Stamp Bottom Left -->
  <g transform="translate(60, 720)">
    <circle cx="30" cy="30" r="28" fill="none" stroke="#a81c1c" stroke-width="3" />
    <text x="70" y="35" font-family="'Roboto', sans-serif" font-weight="700" font-size="16px" fill="#a81c1c">Indian Institute of Technology Madras</text>
  </g>

  <!-- Swayam Logo Bottom Right -->
  <g transform="translate(850, 720)">
    <rect x="0" y="0" width="180" height="36" fill="#0284c7" rx="6" />
    <text x="90" y="24" text-anchor="middle" font-family="'Roboto', sans-serif" font-weight="900" font-size="20px" fill="#ffffff">swayam</text>
  </g>

  <!-- Footer Red Bar -->
  <rect x="15" y="760" width="1100" height="25" class="footer-bg" />
  <text x="40" y="777" class="footer-text">Roll No: NPTEL26CS80S466204239</text>
  <text x="565" y="777" text-anchor="middle" class="footer-text">To verify the certificate visit NPTEL portal</text>
  <text x="1090" y="777" text-anchor="end" class="footer-text">No. of credits recommended: 2</text>
</svg>
