<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800" height="1130">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');
      .cert-bg { fill: #fcfcfc; }
      .border-outer { fill: none; stroke: #222222; stroke-width: 2; }
      .border-inner { fill: none; stroke: #888888; stroke-width: 1; }
      .brand-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 28px; fill: #111827; }
      .certify-label { font-family: 'Merriweather', serif; font-size: 20px; fill: #6b7280; font-style: italic; }
      .recipient-name { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 34px; fill: #111827; }
      .subtext { font-family: 'Inter', sans-serif; font-size: 16px; fill: #4b5563; }
      .course-name { font-family: 'Merriweather', serif; font-weight: 900; font-size: 32px; fill: #0f172a; }
      .course-code { font-family: 'Inter', sans-serif; font-size: 15px; fill: #4b5563; font-weight: 500; }
      .small-text { font-family: 'Inter', sans-serif; font-size: 14px; fill: #6b7280; }
      .issued-by { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; fill: #1f2937; }
      .date-text { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 17px; fill: #111827; }
      .footer-url { font-family: 'Inter', sans-serif; font-size: 12px; fill: #2563eb; text-anchor: middle; font-weight: 500; }
    </style>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1130" fill="#ffffff" />
  <rect x="35" y="35" width="730" height="1060" class="cert-bg" />
  <rect x="35" y="35" width="730" height="1060" class="border-outer" />
  <rect x="42" y="42" width="716" height="1046" class="border-inner" />

  <!-- CognitiveClass Logo -->
  <g transform="translate(70, 75)">
    <!-- Logo Symbol -->
    <circle cx="28" cy="28" r="24" fill="none" stroke="url(#headerGrad)" stroke-width="5"/>
    <circle cx="28" cy="28" r="15" fill="none" stroke="#0284c7" stroke-width="4"/>
    <circle cx="28" cy="28" r="7" fill="#2563eb"/>
    <!-- Logo Text -->
    <text x="68" y="37" class="brand-title">Cognitive<tspan fill="#0284c7">Class</tspan><tspan font-weight="400" fill="#6b7280" font-size="22px">.ai</tspan></text>
  </g>

  <!-- QR Code Mockup top right -->
  <g transform="translate(650, 70)">
    <rect x="0" y="0" width="70" height="70" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <!-- QR modules -->
    <rect x="8" y="8" width="20" height="20" fill="#111827"/>
    <rect x="12" y="12" width="12" height="12" fill="#ffffff"/>
    <rect x="15" y="15" width="6" height="6" fill="#111827"/>

    <rect x="42" y="8" width="20" height="20" fill="#111827"/>
    <rect x="46" y="12" width="12" height="12" fill="#ffffff"/>
    <rect x="49" y="15" width="6" height="6" fill="#111827"/>

    <rect x="8" y="42" width="20" height="20" fill="#111827"/>
    <rect x="12" y="46" width="12" height="12" fill="#ffffff"/>
    <rect x="15" y="49" width="6" height="6" fill="#111827"/>

    <rect x="34" y="34" width="8" height="8" fill="#111827"/>
    <rect x="46" y="46" width="12" height="12" fill="#111827"/>
    <rect x="34" y="52" width="8" height="10" fill="#111827"/>
  </g>

  <!-- Watermark / Subtle Background Banner -->
  <rect x="100" y="220" width="600" height="380" fill="#f1f5f9" rx="16" opacity="0.6"/>

  <!-- Body Content -->
  <text x="400" y="270" text-anchor="middle" class="certify-label">This is to certify that</text>

  <!-- Recipient Name -->
  <text x="400" y="340" text-anchor="middle" class="recipient-name">Toge Rushikesh Nanasaheb</text>

  <text x="400" y="410" text-anchor="middle" class="subtext">successfully completed and received a passing grade in</text>

  <!-- Course Title -->
  <text x="400" y="480" text-anchor="middle" class="course-name">Python 101 for Data Science</text>
  <text x="400" y="520" text-anchor="middle" class="course-code">(PY0101EN, provided by IBM)</text>

  <!-- Course Provider subtext -->
  <text x="400" y="580" text-anchor="middle" class="small-text">A course on cognitiveclass.ai</text>
  <text x="400" y="605" text-anchor="middle" class="small-text">Powered by IBM Developer Skills Network.</text>

  <text x="400" y="670" text-anchor="middle" class="small-text">Issued by</text>
  <text x="400" y="700" text-anchor="middle" class="issued-by">Cognitive Class</text>

  <!-- Signature line / Stamp area -->
  <text x="400" y="770" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13px" fill="#9ca3af">Cognitive Class</text>

  <!-- Date -->
  <text x="400" y="830" text-anchor="middle" class="date-text">May 20, 2026</text>

  <!-- Footer Border Divider -->
  <line x1="70" y1="880" x2="730" y2="880" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Authenticity Footer -->
  <text x="400" y="915" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12px" fill="#6b7280">Authenticity of this certificate can be validated by going to:</text>
  <text x="400" y="938" text-anchor="middle" class="footer-url">https://courses.cognitiveclass.ai/certificates/4f8e61e87ab44942b4a4fe3a48aacef3</text>
</svg>
